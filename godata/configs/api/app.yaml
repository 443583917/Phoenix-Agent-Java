server:
  port: 8066
  mode: "debug"           # debug | release | test
  read_timeout: "30s"
  write_timeout: "60s"
  max_header_bytes: 1048576
cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Trace-Id"
  expose_headers:
    - "Content-Length"
  allow_credentials: true
  max_age: "12h"
auth:
  secret: "${JWT_SECRET}"
  expire: "24h"
