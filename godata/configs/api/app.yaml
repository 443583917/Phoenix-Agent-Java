server:
  port: 8066
  mode: "debug"           # debug | release | test
  read_timeout: "30s"
  write_timeout: "60s"
  max_header_bytes: 1048576
cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Trace-Id"
  expose_headers:
    - "Content-Length"
  allow_credentials: true
  max_age: "12h"
auth:
  secret: "${JWT_SECRET}"
  expire: "24h"
graph:
  max_sql_retry_count: 10
  max_sql_optimize_count: 10
  sql_score_threshold: 0.95
  max_turn_history: 5
  max_plan_length: 2000
  max_columns_per_table: 150
  enable_sql_result_chart: true
  python_max_tries_count: 5
  table_topk_limit: 10
  table_similarity_threshold: 0.2
  default_similarity_threshold: 0.4
  default_topk_limit: 8
